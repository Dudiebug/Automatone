def sensorIntegration = tasks.register('sensorIntegration') {
    description = 'Runs NeoForge GameTests when the project supplies them; otherwise records UNVERIFIED.'
    group = 'verification'
    if (gameTestTask != null) {
        dependsOn gameTestTask
    }
    doLast {
        if (gameTestTask == null || gameTestSources.isEmpty()) {
            emitSensor('neoforge_gametest', 'UNVERIFIED', 'NeoForge GameTest task or project GameTest sources are unavailable.')
            throw new GradleException('UNVERIFIED: NeoForge GameTest runtime evidence is unavailable.')
        }
        emitSensor('neoforge_gametest', 'PASS', 'NeoForge GameTests completed.')
    }
}

def sensorServerRuntime = tasks.register('sensorServerRuntime') {
    description = 'Checks whether off-the-shelf spark server runtime evidence is available.'
    group = 'verification'
    doLast {
        emitSensor('spark_server_health', 'UNVERIFIED', 'No configured dedicated-server workload or spark observation is available.')
        throw new GradleException('UNVERIFIED: spark server runtime evidence is unavailable.')
    }
}

def sensorDependency = tasks.register('sensorDependency') {
    description = 'Runs Dependency-Check only when explicitly enabled; otherwise records UNVERIFIED.'
    group = 'verification'
    if (project.hasProperty('runDependencyCheck')) {
        dependsOn 'dependencyCheckAnalyze'
        doLast {
            emitSensor('dependency_vulnerability', 'PASS', 'OWASP Dependency-Check completed.')
            emitSensor('dependency_resolution', 'PASS', 'Dependency-Check resolved the declared dependency graph.')
        }
    } else {
        doLast {
            emitSensor('dependency_vulnerability', 'UNVERIFIED', 'Dependency-Check is opt-in because NVD database operations are slow.')
            emitSensor('dependency_resolution', 'UNVERIFIED', 'Dependency resolution was not requested by the selected run.')
            throw new GradleException('UNVERIFIED: run with -PrunDependencyCheck to execute Dependency-Check.')
        }
    }
}

