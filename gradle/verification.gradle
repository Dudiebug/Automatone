    description = 'Runs isolated architecture/verification tests.'
    group = 'verification'
    testClassesDirs = sourceSets.sensorTest.output.classesDirs
    classpath = sourceSets.sensorTest.runtimeClasspath
    useJUnit()
    shouldRunAfter test
}

