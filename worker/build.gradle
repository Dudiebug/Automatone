plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'checkstyle'
    id 'jacoco'
    id 'net.ltgt.errorprone'
    id 'com.github.spotbugs'
    id 'org.owasp.dependencycheck'
}

group = rootProject.group
version = rootProject.version
apply from: rootProject.file('gradle/dependency-remediation.gradle')
base.archivesName = 'automatone-worker'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def stageGameTestStructures = tasks.register('stageGameTestStructures', Copy) {
    from 'src/gameTest/structures'
    into layout.buildDirectory.dir('gametest-server/gameteststructures')
}

def stageM3ClientStructures = tasks.register('stageM3ClientStructures', Copy) {
    from 'src/gameTest/structures'
    into layout.buildDirectory.dir('m3-client/gameteststructures')
}

def m4RestartDirectory = layout.buildDirectory.dir(providers.gradleProperty('workerRestartDirectory').orElse('m4-restart'))

def prepareM4RestartFixtures = tasks.register('prepareM4RestartFixtures') {
    def eula = m4RestartDirectory.map { it.file('eula.txt') }
    def properties = m4RestartDirectory.map { it.file('server.properties') }
    outputs.files(eula, properties)
    doLast {
        File fixture = eula.get().asFile
        fixture.parentFile.mkdirs()
        fixture.setText('eula=true\n', 'UTF-8')
        properties.get().asFile.setText('level-type=minecraft:flat\ngenerate-structures=false\nserver-port=0\n', 'UTF-8')
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.gameTest
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    mods {
        automatone { sourceSet rootProject.sourceSets.main }
        automatone_worker { sourceSet sourceSets.main }
        automatone_worker_gametest { sourceSet sourceSets.gameTest }
    }
    runs {
        m3Client {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = layout.buildDirectory.dir('m3-client')
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'automatone_worker_gametest'
            loadedMods = [mods.automatone, mods.automatone_worker, mods.automatone_worker_gametest]
            taskBefore stageM3ClientStructures
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.automatone, mods.automatone_worker]
        }
        m4RestartServer {
            server()
            sourceSet = sourceSets.gameTest
            gameDirectory = m4RestartDirectory
            programArgument '--nogui'
            systemProperty 'automatone.worker.restartPhase', providers.gradleProperty('workerRestartPhase').orElse('').get()
            loadedMods = [mods.automatone, mods.automatone_worker, mods.automatone_worker_gametest]
            taskBefore prepareM4RestartFixtures
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = layout.buildDirectory.dir('gametest-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('workerGameTestNamespaces')
                    .orElse('automatone_worker_gametest,automatone_worker_m4_gametest,automatone_worker_m5_gametest,automatone_worker_m5_roster_gametest,automatone_worker_m5_relocation_gametest,automatone_worker_m5_controller_gametest,automatone_worker_m5_menu_gametest,automatone_worker_m5_notifications_gametest,automatone_worker_m5_inventory_gametest,automatone_worker_m5_placement_gametest,automatone_worker_m5_collection_gametest,automatone_worker_m5_batch_gametest').get()
            loadedMods = [mods.automatone, mods.automatone_worker, mods.automatone_worker_gametest]
            taskBefore stageGameTestStructures
        }
    }
    unitTest {
        enable()
        testedMod = mods.automatone_worker
        loadedMods = [mods.automatone, mods.automatone_worker]
    }
}

dependencies {
    implementation project(':')
    testImplementation 'junit:junit:4.13.2'
    gameTestImplementation project(':')
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('runGameTestServer') { timeout.set(java.time.Duration.ofMinutes(5)) }
tasks.named('runM4RestartServer') { timeout.set(java.time.Duration.ofMinutes(3)) }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

apply from: rootProject.file('gradle/verification.gradle')
